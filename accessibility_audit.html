<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #fff; padding: 40px; }
.container { max-width: 800px; margin: 0 auto; }
h1 { color: #1a1a2e; font-size: 36px; margin-bottom: 20px; }
.item { display: flex; align-items: center; gap: 15px; padding: 15px; border-bottom: 1px solid #eee; }
.check { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; }
.pass { background: #22c55e; }
.fail { background: #ef4444; }
.item p { color: #333; font-size: 16px; }
.summary { margin-top: 30px; padding: 20px; background: #f8f6f3; border-radius: 16px; }
.summary h3 { color: #1a1a2e; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="container">
<h1>Accessibility Audit (WCAG 2.1 AA)</h1>
<div class="item"><div class="check pass">✓</div><p>All images have alt text</p></div>
<div class="item"><div class="check pass">✓</div><p>Keyboard accessible elements</p></div>
<div class="item"><div class="check fail">✗</div><p>Color contrast ratio below 4.5:1</p></div>
<div class="item"><div class="check pass">✓</div><p>Form inputs have labels</p></div>
<div class="item"><div class="check pass">✓</div><p>Headings in logical order</p></div>
<div class="summary">
<h3>Result: 4/5 passed</h3>
<p>Recommendation: fix color contrast on buttons and links.</p>
</div>
</div>
</body>
</html>
