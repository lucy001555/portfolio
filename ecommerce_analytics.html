<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #0d0d1a; padding: 40px; }
.container { max-width: 900px; margin: 0 auto; background: #1a1a2e; border-radius: 24px; padding: 40px; }
h1 { color: #00d4ff; font-size: 36px; margin-bottom: 30px; text-align: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
.card { background: #2a2a4a; padding: 25px; border-radius: 16px; text-align: center; border: 1px solid #444; }
.card h3 { color: #fff; font-size: 18px; margin-bottom: 10px; }
.card p { color: #00d4ff; font-size: 28px; font-weight: 700; }
</style>
</head>
<body>
<div class="container">
<h1>GA4 + Shopify Analytics</h1>
<div class="grid">
<div class="card"><h3>Conversions</h3><p>+42%</p></div>
<div class="card"><h3>Revenue</h3><p>$28.4k</p></div>
<div class="card"><h3>Avg. Order</h3><p>$86</p></div>
<div class="card"><h3>Cart Abandon</h3><p>-18%</p></div>
</div>
</div>
</body>
</html>
