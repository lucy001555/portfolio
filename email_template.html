<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin: 0; padding: 0; background: #f4f4f4; font-family: Arial, sans-serif; }
.container { max-width: 600px; margin: 20px auto; background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
.header { background: #1a1a2e; padding: 30px; text-align: center; color: #ffffff; font-size: 24px; font-weight: 700; }
.content { padding: 40px 30px; color: #333333; line-height: 1.6; }
.content h2 { margin-top: 0; color: #1a1a2e; }
.btn { display: inline-block; background: #00d4ff; color: #1a1a2e; padding: 14px 40px; border-radius: 30px; text-decoration: none; font-weight: 700; margin-top: 20px; }
.footer { background: #f4f4f4; padding: 20px; text-align: center; font-size: 12px; color: #888888; }
</style>
</head>
<body>
<div class="container">
<div class="header">SWILL</div>
<div class="content">
<h2>Привет, Даниил!</h2>
<p>Это пример адаптивного email-шаблона, который корректно отображается в Gmail, Outlook, Apple Mail и мобильных клиентах.</p>
<p>Шаблон готов к использованию в любых рассылках.</p>

</div>
<div class="footer">© 2026 SWILL. Все права защищены.</div>
</div>
</body>
</html>
