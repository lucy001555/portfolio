<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #f8f6f3; }
.hero { text-align: center; padding: 100px 20px; background: #ffffff; }
h1 { font-size: 52px; color: #1a1a2e; margin-bottom: 20px; }
p { font-size: 20px; color: #555; margin-bottom: 30px; }
.btn { background: #1a1a2e; color: #fff; padding: 16px 50px; border-radius: 40px; text-decoration: none; font-size: 18px; font-weight: 600; display: inline-block; }
.features { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; padding: 60px 20px; max-width: 1000px; margin: 0 auto; }
.feature { background: #fff; padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
.feature h3 { color: #1a1a2e; margin-bottom: 10px; }
.feature p { font-size: 16px; color: #666; }
</style>
</head>
<body>
<div class="hero">
<h1>Создаём сайты, которые продают</h1>
<p>Адаптивные лендинги, анимации, интеграции</p>
<a href="#" class="btn">Заказать сайт</a>
</div>
<div class="features">
<div class="feature"><h3>Адаптив</h3><p>Работает на всех устройствах</p></div>
<div class="feature"><h3>Анимация</h3><p>Плавные переходы и эффекты</p></div>
<div class="feature"><h3>Скорость</h3><p>Загрузка меньше 1 секунды</p></div>
</div>
</body>
</html>
