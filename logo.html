<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
  background: #0d0d1a;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
}
.logo {
  font-size: 72px;
  font-weight: 900;
  color: #00d4ff;
  animation: pulse 2s infinite ease-in-out;
  text-shadow: 0 0 30px rgba(0,212,255,0.4);
  letter-spacing: 2px;
}
@keyframes pulse {
  0% { transform: scale(1); text-shadow: 0 0 30px rgba(0,212,255,0.4); }
  50% { transform: scale(1.15); text-shadow: 0 0 60px rgba(0,212,255,0.8); }
  100% { transform: scale(1); text-shadow: 0 0 30px rgba(0,212,255,0.4); }
}
</style>
</head>
<body>
<div class="logo">SWILL</div>
</body>
</html>
